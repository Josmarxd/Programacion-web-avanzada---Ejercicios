<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Círculo</title>
</head>
<body>
    <h1>Calculadora de Área y Circunferencia de un Círculo</h1>
    <label for="radio">Radio:</label>
    <input type="number" id="radio" placeholder="Ingresa el radio">
    <br><br>
    <button onclick="calcularArea()">Calcular Área</button>
    <button onclick="calcularCircunferencia()">Calcular Circunferencia</button>
    <br><br>
    <div id="area"></div>
    <div id="circunferencia"></div>
    <script src="Script.js"></script>
</body>
</html>
